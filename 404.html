<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · 这条走线不通</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --paper:#FBF7EC; --ink:#3A3A44; --ink-70:rgba(58,58,68,.7); --ink-45:rgba(58,58,68,.45);
    --wing:#7C5CBF; --gold:#F2B441; --line:#D4D1CA;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:grid;place-items:center;padding:32px;
  }
  .box{width:100%;max-width:520px}
  .mark{width:88px;height:48px;display:block;margin-bottom:28px}
  .code{
    font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;
    font-size:12px;letter-spacing:.14em;color:var(--ink-45);margin:0 0 10px;
  }
  h1{font-size:clamp(26px,6vw,34px);line-height:1.3;margin:0 0 14px;font-weight:700;letter-spacing:-.01em}
  p{font-size:15px;line-height:1.85;color:var(--ink-70);margin:0 0 30px;max-width:34em}
  a.back{
    display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 22px;
    border:1px solid var(--ink);border-radius:999px;color:var(--ink);
    text-decoration:none;font-size:14px;transition:background .2s,color .2s;
  }
  a.back:hover{background:var(--ink);color:var(--paper)}
  .rule{height:1px;background:var(--line);margin:34px 0 0}
  .foot{margin-top:14px;font-size:12px;color:var(--ink-45);font-family:ui-monospace,Consolas,monospace;letter-spacing:.06em}
</style>
</head>
<body>
  <div class="box">
    <svg class="mark" viewBox="0 0 192 104" aria-hidden="true">
      <path fill="#7C5CBF" d="M96 62C78 40 46 20 18 22 8 23 2 32 6 44c6 18 30 30 62 30 10 0 20-2 28-6z"/>
      <path fill="#F2B441" d="M96 62c18 22 50 32 78 30 10-2 16-10 12-22-6-18-30-26-62-26-10 0-20 2-28 6z"/>
      <circle cx="96" cy="64" r="7" fill="#3A3A44"/>
    </svg>
    <p class="code">ERR 404 / NO ROUTE</p>
    <h1>这条走线不通</h1>
    <p>你要找的页面不在这块板子上。可能是链接过期，也可能是路径写错了——回到首页重新走一遍。</p>
    <a class="back" href="/">返回首页 →</a>
    <div class="rule"></div>
    <p class="foot">biohacker.fun · netadmin-toolbox</p>
  </div>
</body>
</html>
